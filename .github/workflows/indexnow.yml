name: IndexNow ping

# After every push to main, tell Bing / Yandex / Naver which pages changed.
# Google ignores IndexNow; it picks changes up from sitemap.xml on its own.

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "**/index.html"
      - "sitemap.xml"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for GitHub Pages to publish the new commit
        run: |
          for i in $(seq 1 30); do
            live=$(curl -s "https://getpullupmaster.app/sitemap.xml" | grep -c '<loc>' || true)
            local_count=$(grep -c '<loc>' sitemap.xml || true)
            if [ "$live" = "$local_count" ]; then echo "pages live"; exit 0; fi
            sleep 10
          done
          echo "sitemap counts never matched, pinging anyway"

      - name: Submit changed pages to IndexNow
        run: bash scripts/indexnow.sh --changed "${{ github.event.before }}"
